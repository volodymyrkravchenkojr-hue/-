<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>График смен и ротаций</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--surface:#fff;--ink:#16211d;--mute:#5d6b65;--line:#d9dfdc;--accent:#0f6b54;--accent-ink:#fff;--danger:#b3372b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101614;--surface:#18211e;--ink:#e8efec;--mute:#9aaaa3;--line:#2b3833;--accent:#46c29f;--accent-ink:#06231a;--danger:#ef8478;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101614;--surface:#18211e;--ink:#e8efec;--mute:#9aaaa3;--line:#2b3833;--accent:#46c29f;--accent-ink:#06231a;--danger:#ef8478;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.lang{display:flex}.lang button{padding:4px 12px;border-radius:0}.lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0;border-left:0}.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h1{font-size:24px;margin:0 0 4px;font-weight:600}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
.sub{color:var(--mute);margin:0 0 20px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.head h2{margin:0}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:84px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button.del{color:var(--danger);padding:4px 8px;font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--c,var(--accent))}
.card .top{display:flex;gap:8px;align-items:center}
.cnt{font-size:13px;color:var(--mute)}
.row3{display:grid;gap:8px;grid-template-columns:2fr 1fr 1fr}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
tr:last-child td{border-bottom:0}
thead th{background:var(--bg);font-weight:600}
th.d{position:sticky;left:0;background:var(--surface);z-index:1;font-weight:500}
thead th.d{background:var(--bg)}
.chip{display:inline-block;padding:3px 8px;border-radius:5px;font-size:13px;font-weight:500;background:color-mix(in srgb,var(--c) 22%,var(--surface));border-left:4px solid var(--c)}
.chip small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.empty{color:var(--mute);padding:8px 0}
.now th.d{box-shadow:inset 3px 0 0 var(--accent)}
.card select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.pl select{font:inherit;font-size:13px;color:var(--ink);background:color-mix(in srgb,var(--c) 22%,var(--surface));border:1px solid var(--line);border-left:4px solid var(--c);border-radius:5px;padding:4px 6px}.pl td.ov select{outline:2px solid var(--accent);outline-offset:1px}.wkh{background:var(--bg);font-weight:600;color:var(--mute)}.btns{display:flex;gap:6px;flex-wrap:wrap}
@media print{.noprint{display:none!important}body{background:#fff}section{border:0;padding:0}}
</style>
</head>
<body>
<main>
<div class="bar"><h1 data-i="title"></h1><div class="lang noprint" role="group" aria-label="Language"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div></div>
<p class="sub" data-i="sub"></p>

<section class="noprint">
  <div class="head"><h2 data-i="groups"></h2><button class="primary" id="addG" data-i="addG"></button></div>
  <div class="grid" id="groups"></div>
</section>

<section class="noprint">
  <div class="head"><h2 data-i="shifts"></h2><button class="primary" id="addS" data-i="addS"></button></div>
  <div id="shifts"></div>
  <p class="cnt" data-i="shiftHint"></p>
</section>

<section>
  <div class="head"><h2 data-i="sched"></h2><button class="noprint" onclick="window.print()" data-i="print"></button></div>
  <div class="opts noprint">
    <div><label for="start" data-i="start"></label><input type="date" id="start"></div>
    <div><label for="period" data-i="period"></label><input type="number" id="period" min="1" max="60"></div>
    <div><label for="count" data-i="count"></label><input type="number" id="count" min="1" max="52"></div>
  </div>
  <div id="sched"></div>
</section>
<section><div class="head"><h2 data-i="plan"></h2><div class="btns noprint"><button id="pPrev" data-i="prev"></button><button id="pToday" data-i="todayBtn"></button><button id="pNext" data-i="next"></button><button id="pReset" data-i="reset"></button></div></div><p class="cnt noprint" data-i="planHint"></p><div id="plan"></div></section>
</main>
<script>
var KEY='smeny-v1',COL=['#0f6b54','#2f6fd0','#b8641a','#8a4fb5','#c2415a','#5d7a1f'];
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
var S={groups:[{name:'Группа А',note:'Основной цех',members:'Иванов И.\nПетров П.'},{name:'Группа Б',note:'Склад',members:'Сидоров С.\nКузнецова А.'},{name:'Группа В',note:'Доставка',members:'Орлов Д.'}],
shifts:[{name:'День',start:'08:00',hours:12},{name:'Ночь',start:'20:00',hours:12},{name:'Выходной',start:'00:00',hours:0}],
start:today(),period:4,count:8,sample:true};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.groups&&p.shifts)S=p}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S.groups.forEach(function(g){if(!g.id)g.id=Math.random().toString(36).slice(2,8)});
if(!S.lang)S.lang=(navigator.language||'en').slice(0,2)==='ru'?'ru':'en';
var T={ru:{title:'График ротаций',sub:'Добавьте группы и статусы (например, «Работает» и «Подготовка»), задайте дату первого заезда и срок ротации. Расписание считается само, данные сохраняются в этом браузере.',groups:'Группы',addG:'Добавить группу',shifts:'Статусы',addS:'Добавить статус',shiftHint:'Ротирующиеся группы по очереди сдвигаются по этому списку: пока одна работает, другая готовится.',sched:'Расписание ротаций',print:'Печать',start:'Дата первой ротации',period:'Шаг ротации, дней',count:'Сколько ротаций показать',gname:'Название группы',note:'Специфика работы',mem:'Состав, по одному человеку в строке',cnt:'Человек в группе: ',del:'Удалить',sure:'Точно удалить?',mode:'Режим',rot:'По ротации',always:'Всегда:',plan:'План на 4 недели',planHint:'Статусы считаются по ротации. Чтобы изменить день, выберите другой статус в нужной ячейке: изменение подсветится.',prev:'← Неделя',next:'Неделя →',todayBtn:'Сегодня',reset:'Сбросить правки',day:'День',week:'Неделя',noG:'Групп пока нет. Добавьте первую.',noS:'Добавьте хотя бы один статус.',name:'Название',from:'Начало',hrs:'Часов',h:'ч',periodCol:'Период',now:'сейчас',needAll:'Добавьте группы, статусы и дату старта, чтобы увидеть расписание.',group:'Группа',shift:'Статус',confirmDel:'Удалить группу «%»?'},
en:{title:'Rotation schedule',sub:'Add groups and statuses (for example “Working” and “Preparing”), set the first arrival date and the rotation length. The schedule is calculated automatically and saved in this browser.',groups:'Groups',addG:'Add group',shifts:'Statuses',addS:'Add status',shiftHint:'Rotating groups move down this list in turn: while one is working, the other is preparing.',sched:'Rotation schedule',print:'Print',start:'First rotation date',period:'Rotation step, days',count:'Number of rotations to show',gname:'Group name',note:'Work specifics',mem:'Members, one person per line',cnt:'People in group: ',del:'Delete',sure:'Delete for sure?',mode:'Mode',rot:'Rotating',always:'Always:',plan:'4-week plan',planHint:'Statuses follow the rotation. To change a day, pick another status in the cell; edited cells are highlighted.',prev:'← Week',next:'Week →',todayBtn:'Today',reset:'Reset edits',day:'Day',week:'Week',noG:'No groups yet. Add the first one.',noS:'Add at least one status.',name:'Name',from:'Start',hrs:'Hours',h:'h',periodCol:'Period',now:'now',needAll:'Add groups, statuses and a start date to see the schedule.',group:'Group',shift:'Status',confirmDel:'Delete group “%”?'}};
function t(k){return T[S.lang][k]}
function tr(k){return T[S.lang][k]}
var pend=-1;
var SAMPLE={ru:{g:[['Группа А','Основной цех','Иванов И.\nПетров П.'],['Группа Б','Склад','Сидоров С.\nКузнецова А.'],['Группа В','Доставка','Орлов Д.']],s:[['День','08:00',12],['Ночь','20:00',12],['Выходной','00:00',0]]},en:{g:[['Group A','Main shop','Smith J.\nBrown P.'],['Group B','Warehouse','Taylor S.\nWilson A.'],['Group C','Delivery','Davis D.']],s:[['Day','08:00',12],['Night','20:00',12],['Day off','00:00',0]]}};
SAMPLE={ru:{g:[['Группа А','Основной цех','Иванов И.\nПетров П.'],['Группа Б','Основной цех','Сидоров С.\nКузнецова А.'],['Группа В','Склад','Орлов Д.\nСмирнова Е.'],['Группа Г','Склад','Козлов М.\nВолкова Н.']],s:[['Работа','00:00',0],['Отдых','00:00',0]]},en:{g:[['Group A','Main shop','Smith J.\nBrown P.'],['Group B','Main shop','Taylor S.\nWilson A.'],['Group C','Warehouse','Davis D.\nMoore E.'],['Group D','Warehouse','Clark M.\nHall N.']],s:[['Work','00:00',0],['Rest','00:00',0]]}};
SAMPLE={ru:{g:[['Группа А','Основной цех','Иванов И.\nПетров П.\nСидоров С.\nКузнецова А.\nОрлов Д.','0'],['Группа Б','Основной цех','Смирнова Е.\nКозлов М.\nВолкова Н.\nНовиков А.\nМорозов К.',''],['Группа В','Основной цех','Лебедев Р.\nСоколова Т.\nПопов В.\nЗайцев О.\nПавлова Ю.',''],['Группа Г','Резерв','Фёдоров Г.\nМихайлов Л.\nБеляева С.\nТарасов Н.\nЯковлева М.','1']],s:[['Работа','00:00',0],['Отдых','00:00',0]]},en:{g:[['Group A','Main shop','Smith J.\nBrown P.\nTaylor S.\nWilson A.\nDavis D.','0'],['Group B','Main shop','Moore E.\nClark M.\nHall N.\nYoung A.\nKing K.',''],['Group C','Main shop','Scott R.\nAdams T.\nBaker V.\nGreen O.\nHill J.',''],['Group D','Reserve','Wright G.\nLopez L.\nReed S.\nCook N.\nBell M.','1']],s:[['Work','00:00',0],['Rest','00:00',0]]}};
SAMPLE={ru:{g:[['Группа А','Постоянная группа','Иванов И.\nПетров П.\nСидоров С.\nКузнецова А.\nОрлов Д.','0'],['Группа Б','Ротационная группа','Смирнова Е.\nКозлов М.\nВолкова Н.\nНовиков А.\nМорозов К.',''],['Группа В','Ротационная группа','Лебедев Р.\nСоколова Т.\nПопов В.\nЗайцев О.\nПавлова Ю.','']],s:[['Работает','00:00',0],['Подготовка','00:00',0]]},en:{g:[['Group A','Permanent group','Smith J.\nBrown P.\nTaylor S.\nWilson A.\nDavis D.','0'],['Group B','Rotating group','Moore E.\nClark M.\nHall N.\nYoung A.\nKing K.',''],['Group C','Rotating group','Scott R.\nAdams T.\nBaker V.\nGreen O.\nHill J.','']],s:[['Working','00:00',0],['Preparing','00:00',0]]}};
function isPrev(){return S.groups.length===4&&S.shifts.length===2&&(S.shifts[1].name==='Отдых'||S.shifts[1].name==='Rest')&&(S.groups[3].name==='Группа Г'||S.groups[3].name==='Group D')}
function isOld(){return S.groups.length===3&&S.shifts.length===3&&(S.groups[0].name==='Группа А'||S.groups[0].name==='Group A')&&(S.shifts[0].name==='День'||S.shifts[0].name==='Day')}
function isSample(l){var m=SAMPLE[l];return S.groups.length===m.g.length&&S.shifts.length===m.s.length&&S.groups.every(function(g,i){return g.name===m.g[i][0]&&g.note===m.g[i][1]&&g.members===m.g[i][2]})&&S.shifts.every(function(s,i){return s.name===m.s[i][0]&&s.start===m.s[i][1]&&+s.hours===m.s[i][2]})}
function useSample(){var m=SAMPLE[S.lang];S.groups=m.g.map(function(x,i){var o=S.groups[i];return{id:(o&&o.id)||Math.random().toString(36).slice(2,8),name:x[0],note:x[1],members:x[2],fix:x[3]}});S.shifts=m.s.map(function(x){return{name:x[0],start:x[1],hours:x[2]}})}
if(S.sample===undefined)S.sample=isSample('ru')||isSample('en')||isOld();if(S.sample&&isOld()){S.period=4;S.count=8;S.over={}}if(isPrev())S.sample=true;if(S.shifts.some(function(s){return['День','Ночь','Выходной','Day','Night','Day off'].indexOf(s.name)>-1})){S.sample=true;S.period=4;S.count=8;S.over={}}
function applyLang(){document.documentElement.lang=S.lang;document.title=t('title');if(S.sample)useSample();document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i)});document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===S.lang)});renderAll()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function members(g){return g.members.split('\n').filter(function(x){return x.trim()}).length}

function modeOpts(g){var o='<option value="">'+t('rot')+'</option>';S.shifts.forEach(function(s,i){o+='<option value="'+i+'"'+(String(g.fix)===String(i)?' selected':'')+'>'+t('always')+' '+esc(s.name)+'</option>'});return o}
function gsi(gi,r){var L=S.shifts.length,g=S.groups[gi];if(g.fix!==undefined&&g.fix!==''&&+g.fix<L)return +g.fix;var k=0;for(var j=0;j<gi;j++){var f=S.groups[j].fix;if(f===undefined||f===''||+f>=L)k++}return(((k+r)%L)+L)%L}
function renderGroups(){
  var el=document.getElementById('groups');
  if(!S.groups.length){el.innerHTML='<p class="empty">'+t('noG')+'</p>';return}
  el.innerHTML=S.groups.map(function(g,i){return '<div class="card" style="--c:'+COL[i%COL.length]+'">'+
  '<div class="top"><input aria-label="'+t('gname')+'" data-g="'+i+'" data-f="name" value="'+esc(g.name)+'"><button class="del" data-delg="'+i+'">'+(pend===i?t('sure'):t('del'))+'</button></div>'+
  '<div><label>'+t('note')+'</label><input data-g="'+i+'" data-f="note" value="'+esc(g.note)+'"></div>'+
  '<div><label>'+t('mem')+'</label><textarea data-g="'+i+'" data-f="members">'+esc(g.members)+'</textarea></div>'+
  '<div><label>'+t('mode')+'</label><select data-g="'+i+'" data-f="fix">'+modeOpts(g)+'</select></div>'+
  '<div class="cnt" id="cnt'+i+'">'+t('cnt')+members(g)+'</div></div>'}).join('')
}
function renderShifts(){
  var el=document.getElementById('shifts');
  if(!S.shifts.length){el.innerHTML='<p class="empty">'+t('noS')+'</p>';return}
  el.innerHTML=S.shifts.map(function(s,i){return '<div class="row3" style="margin-bottom:8px"><div><label>'+t('name')+'</label><input data-s="'+i+'" data-f="name" value="'+esc(s.name)+'"></div>'+
  '<div><label>'+t('from')+'</label><input type="time" data-s="'+i+'" data-f="start" value="'+esc(s.start)+'"></div>'+
  '<div><label>'+t('hrs')+'</label><div style="display:flex;gap:6px"><input type="number" min="0" max="24" data-s="'+i+'" data-f="hours" value="'+s.hours+'"><button class="del" data-dels="'+i+'">×</button></div></div></div>'}).join('')
}
function renderShifts(){var el=document.getElementById('shifts');if(!S.shifts.length){el.innerHTML='<p class="empty">'+t('noS')+'</p>';return}el.innerHTML=S.shifts.map(function(s,i){return '<div style="display:flex;gap:6px;align-items:end;margin-bottom:8px;max-width:420px"><div style="flex:1"><label>'+t('name')+'</label><input data-s="'+i+'" data-f="name" value="'+esc(s.name)+'"></div><button class="del" data-dels="'+i+'">×</button></div>'}).join('')}
function fmt(d){return d.toLocaleDateString(S.lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'short'})}
function endTime(s){var p=s.start.split(':'),m=(+p[0]*60+ +p[1]+ +s.hours*60)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function renderSched(){
  var el=document.getElementById('sched');
  if(!S.groups.length||!S.shifts.length||!S.start){el.innerHTML='<p class="empty">'+t('needAll')+'</p>';return}
  var per=Math.max(1,+S.period||1),n=Math.min(52,Math.max(1,+S.count||1)),b=new Date(S.start+'T00:00:00'),tdy=new Date(today()+'T00:00:00');
  var h='<div class="scroll"><table><thead><tr><th class="d">'+t('periodCol')+'</th>'+S.groups.map(function(g,i){return '<th>'+esc(g.name)+'<div class="cnt" style="font-weight:400">'+esc(g.note)+'</div></th>'}).join('')+'</tr></thead><tbody>';
  var r0=Math.max(0,Math.floor(dd(tdy,b)/per));for(var r=r0;r<r0+n;r++){
    var a=new Date(b);a.setDate(a.getDate()+r*per);var z=new Date(a);z.setDate(z.getDate()+per-1);
    var cur=tdy>=a&&tdy<=z;
    h+='<tr class="'+(cur?'now':'')+'"><th class="d">'+fmt(a)+' – '+fmt(z)+(cur?'<div class="cnt">'+t('now')+'</div>':'')+'</th>';
    S.groups.forEach(function(g,gi){var si=gsi(gi,r),s=S.shifts[si];
      h+='<td><span class="chip" style="--c:'+COL[si%COL.length]+'">'+esc(s.name)+(+s.hours>0?'<small>'+esc(s.start)+'–'+endTime(s)+', '+s.hours+' '+t('h')+'</small>':'')+'</span></td>'});
    h+='</tr>'}
  el.innerHTML=h+'</tbody></table></div>'
}
function dd(a,b){return Math.round((a-b)/864e5)}
function mon(d){var x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function iso(d){var x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
function defIdx(gi,d){var L=S.shifts.length,per=Math.max(1,+S.period||1),r=Math.floor(dd(d,new Date(S.start+'T00:00:00'))/per);return gsi(gi,r)}
function renderPlan(){
  var el=document.getElementById('plan');
  if(!S.groups.length||!S.shifts.length||!S.start){el.innerHTML='<p class="empty">'+t('needAll')+'</p>';return}
  if(!S.view)S.view=iso(mon(new Date()));
  var v=new Date(S.view+'T00:00:00'),loc=S.lang==='ru'?'ru-RU':'en-GB',td=iso(new Date()),L=S.shifts.length;
  var h='<div class="scroll pl"><table><thead><tr><th class="d">'+t('day')+'</th>'+S.groups.map(function(g){return '<th>'+esc(g.name)+'</th>'}).join('')+'</tr></thead><tbody>';
  for(var i=0;i<28;i++){
    var d=new Date(v);d.setDate(d.getDate()+i);var k=iso(d);
    if(i%7===0){var e2=new Date(d);e2.setDate(e2.getDate()+6);h+='<tr><td colspan="'+(S.groups.length+1)+'" class="wkh">'+t('week')+' '+fmt(d)+' – '+fmt(e2)+'</td></tr>'}
    h+='<tr class="'+(k===td?'now':'')+'"><th class="d">'+d.toLocaleDateString(loc,{weekday:'short',day:'numeric',month:'short'})+'</th>';
    S.groups.forEach(function(g,gi){
      var di=defIdx(gi,d),key=g.id+'|'+k,ov=S.over?S.over[key]:undefined;
      if(ov!==undefined&&ov>=L)ov=undefined;
      var ix=ov!==undefined?ov:di;
      h+='<td class="'+(ov!==undefined?'ov':'')+'"><select data-p="'+key+'" data-d="'+di+'" style="--c:'+COL[ix%COL.length]+'" aria-label="'+esc(g.name)+' '+k+'">'+S.shifts.map(function(s,si){return '<option value="'+si+'"'+(si===ix?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select></td>'});
    h+='</tr>'}
  el.innerHTML=h+'</tbody></table></div>'
}
document.addEventListener('change',function(e){var s=e.target;if(s.dataset.p===undefined)return;if(!S.over)S.over={};var n=+s.value;if(n===+s.dataset.d)delete S.over[s.dataset.p];else S.over[s.dataset.p]=n;save();renderPlan()});
function renderAll(){renderGroups();renderShifts();renderSched();renderPlan()}

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.g!==undefined){S.sample=false;S.groups[+t.dataset.g][t.dataset.f]=t.value;if(t.dataset.f==='members'){document.getElementById('cnt'+t.dataset.g).textContent=tr('cnt')+members(S.groups[+t.dataset.g])}}
  else if(t.dataset.s!==undefined){S.sample=false;S.shifts[+t.dataset.s][t.dataset.f]=t.dataset.f==='hours'?(+t.value||0):t.value}
  else if(t.id==='start')S.start=t.value;
  else if(t.id==='period')S.period=+t.value;
  else if(t.id==='count')S.count=+t.value;
  else return;
  save();renderSched();renderPlan()
});
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.dataset.lang){S.lang=t.dataset.lang;applyLang()}
  else if(t.id==='pPrev'||t.id==='pNext'||t.id==='pToday'){var x=new Date((S.view||iso(mon(new Date())))+'T00:00:00');if(t.id==='pToday')x=mon(new Date());else x.setDate(x.getDate()+(t.id==='pNext'?7:-7));S.view=iso(x);save();renderPlan();return}
  else if(t.id==='pReset'){S.over={};renderPlan()}
  else if(t.id==='addG'){S.sample=false;S.groups.push({id:Math.random().toString(36).slice(2,8),name:tr('group')+' '+(S.groups.length+1),note:'',members:''});renderAll()}
  else if(t.id==='addS'){S.sample=false;S.shifts.push({name:tr('shift')+' '+(S.shifts.length+1),start:'00:00',hours:0});renderAll()}
  else if(t.dataset.delg!==undefined){var gi=+t.dataset.delg;if(pend===gi){S.sample=false;pend=-1;S.groups.splice(gi,1);renderAll()}else{pend=gi;renderAll();setTimeout(function(){if(pend===gi){pend=-1;renderAll()}},4000);return}}
  else if(t.dataset.dels!==undefined){S.sample=false;S.shifts.splice(+t.dataset.dels,1);renderAll()}
  else return;
  save()
});
document.getElementById('start').value=S.start;
document.getElementById('period').value=S.period;
document.getElementById('count').value=S.count;
applyLang();
</script>
</body>
</html>
