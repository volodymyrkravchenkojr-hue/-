  for(var i=0;i<28;i++){var d=addD(v,i),k=iso(d);rows.push([k].concat(S.groups.map(function(g,gi){return S.shifts[effIdx(gi,d)].name}),[(S.notes&&S.notes[k])||'']))}
  var csv='\ufeff'+rows.map(function(r){return r.map(q).join(';')}).join('\r\n'),name='rotations-'+iso(v)+'.csv',P=window.Capacitor&&window.Capacitor.Plugins;
  if(P&&P.Filesystem&&P.Share){P.Filesystem.writeFile({path:name,data:btoa(unescape(encodeURIComponent(csv))),directory:'CACHE'}).then(function(r){return P.Share.share({title:name,files:[r.uri]})}).catch(function(){})}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click()}
}
function scheduleReminders(){
  var P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
  if(!P)return;
  P.getPending().then(function(p){var o=p.notifications.filter(function(n){return n.id<9000});return o.length?P.cancel({notifications:o}):0}).then(function(){
    var gi=S.groups.findIndex(function(g){return g.id===S.me});
    if(gi<0||!S.shifts.length)return;
    return P.requestPermissions().then(function(pm){
      if(pm.display!=='granted')return;
      var td=new Date();td.setHours(0,0,0,0);var list=[],prev=effIdx(gi,addD(td,-1)),now=new Date();
      for(var i=0;i<60;i++){var d=addD(td,i),cur=effIdx(gi,d);
        if(cur===0&&prev!==0){var at=addD(d,-1);at.setHours(18,0,0,0);if(at>now)list.push({id:list.length+1,title:t('remTitle'),body:S.groups[gi].name+', '+d.toLocaleDateString(S.lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'long'}),schedule:{at:at}})}
        prev=cur}
      if(list.length)return P.schedule({notifications:list})})
  }).catch(function(){})}
function dd(a,b){return Math.round((a-b)/864e5)}
function mon(d){var x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function iso(d){var x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
function defIdx(gi,d){var L=S.shifts.length,per=Math.max(1,+S.period||1),r=Math.floor(dd(d,new Date(S.start+'T00:00:00'))/per);return gsi(gi,r,d)}
function renderPlan(){return;
  var el=document.getElementById('plan');
  if(!S.groups.length||!S.shifts.length||!S.start){el.innerHTML='<p class="empty">'+t('needAll')+'</p>';return}
  if(!S.view)S.view=iso(mon(new Date()));
  var v=new Date(S.view+'T00:00:00'),loc=S.lang==='ru'?'ru-RU':'en-GB',td=iso(new Date()),L=S.shifts.length;
  var h='<div class="scroll pl"><table><thead><tr><th class="d">'+t('day')+'</th>'+S.groups.map(function(g){return '<th>'+esc(g.name)+'</th>'}).join('')+'<th>'+t('noteCol')+'</th>'+'</tr></thead><tbody>';
  for(var i=0;i<28;i++){
    var d=new Date(v);d.setDate(d.getDate()+i);var k=iso(d);
    if(i%7===0){var e2=new Date(d);e2.setDate(e2.getDate()+6);h+='<tr><td colspan="'+(S.groups.length+2)+'" class="wkh">'+t('week')+' '+fmt(d)+' – '+fmt(e2)+'</td></tr>'}
    h+='<tr class="'+(k===td?'now':'')+'"><th class="d">'+d.toLocaleDateString(loc,{weekday:'short',day:'numeric',month:'short'})+'</th>';
    S.groups.forEach(function(g,gi){
      var di=defIdx(gi,d),key=g.id+'|'+k,ov=S.over?S.over[key]:undefined;
      if(ov!==undefined&&ov>=L)ov=undefined;
      var ix=ov!==undefined?ov:di;
      h+='<td class="'+(ov!==undefined?'ov':'')+'"><select data-p="'+key+'" data-d="'+di+'" style="--c:'+COL[ix%COL.length]+'" aria-label="'+esc(g.name)+' '+k+'">'+S.shifts.map(function(s,si){return '<option value="'+si+'"'+(si===ix?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select></td>'});
    h+='<td><input data-n="'+k+'" value="'+esc((S.notes&&S.notes[k])||'')+'" style="min-width:150px"></td>';
    h+='</tr>'}
  el.innerHTML=h+'</tbody></table></div>'
}
document.addEventListener('change',function(e){var s=e.target;if(s.id==='me'){S.me=s.value;save();scheduleReminders();return}if(s.dataset.p===undefined)return;if(!S.over)S.over={};var n=+s.value;if(n===+s.dataset.d)delete S.over[s.dataset.p];else S.over[s.dataset.p]=n;save();renderPlan()});
function renderAll(){renderPeople();renderGroups();renderShifts();renderSched();renderMe();applyRO()}

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.g!==undefined){S.sample=false;S.groups[+t.dataset.g][t.dataset.f]=t.value;if(t.dataset.f==='members'||t.dataset.f==='nums'){refreshNames()}else if(t.dataset.f==='fix')renderGroups()}
  else if(t.dataset.s!==undefined){S.sample=false;S.shifts[+t.dataset.s][t.dataset.f]=t.dataset.f==='hours'?(+t.value||0):t.value}
  else if(t.dataset.pp!==undefined){S.sample=false;S.people[+t.dataset.pp].name=t.value;refreshNames()}
  else if(t.dataset.n!==undefined){if(!S.notes)S.notes={};if(t.value)S.notes[t.dataset.n]=t.value;else delete S.notes[t.dataset.n];save();return}
  else if(t.id==='start')S.start=t.value;
  else if(t.id==='period')S.period=+t.value;
  else if(t.id==='count')S.count=+t.value;
  else return;
  save();renderSched();renderPlan()
});
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.dataset.lang){S.lang=t.dataset.lang;applyLang()}
  else if(t.id==='pPrev'||t.id==='pNext'||t.id==='pToday'){var x=new Date((S.view||iso(mon(new Date())))+'T00:00:00');if(t.id==='pToday')x=mon(new Date());else x.setDate(x.getDate()+(t.id==='pNext'?7:-7));S.view=iso(x);save();renderPlan();return}
  else if(t.id==='exCsv'){exportCsv();return}
  else if(t.id==='addP'){S.sample=false;S.people.push({n:nextN(),name:''});renderPeople();var ins=document.querySelectorAll('#people input');if(ins.length)ins[ins.length-1].focus()}
  else if(t.id==='addBulk'){var bl=document.getElementById('bulk');bl.value.split('\n').forEach(function(x){x=x.trim();if(x){S.sample=false;S.people.push({n:nextN(),name:x})}});bl.value='';renderPeople();refreshNames()}
  else if(t.dataset.delp!==undefined){S.sample=false;S.people.splice(+t.dataset.delp,1);renderPeople();refreshNames()}
  else if(t.id==='netTest'){netTest();return}
  else if(t.id==='syncUp'){if(!S.code){setSync('needCode')}else{pushNow(true)}return}
  else if(t.id==='syncDown'){if(armed){armed=false;pull(true)}else{armed=true;t.textContent=tr('syncSure');setTimeout(function(){armed=false;t.textContent=tr('syncDown')},4000)}return}
  else if(t.id==='exPdf'){exportPdf();return}
  else if(t.id==='bnOk'){document.getElementById('banner').hidden=true;return}
  else if(t.id==='codeOut'){S.code='';save();applyRO();setSync(lastSK);pull();return}
  else if(t.id==='codeIn'){var cv=document.getElementById('code').value;if(!cv)return;S.code=cv;document.getElementById('code').value='';save();applyRO();setSync('syncWait');fetch(SBR+'/check_code',{method:'POST',headers:H,body:JSON.stringify({c:cv})}).then(function(r){return r.ok?r.json():Promise.reject(new Error('check_code '+r.status))}).then(function(ok){if(ok===true){pull()}else{S.code='';save();applyRO();setSync('syncDenied')}}).catch(function(e){lastErr=String(e&&e.message||e).slice(0,100);setSync('syncOff')});return}
  else if(t.id==='pReset'){S.over={};renderPlan()}
  else if(t.id==='addG'){S.sample=false;S.groups.push({id:Math.random().toString(36).slice(2,8),name:tr('group')+' '+(S.groups.length+1),note:'',members:''});renderAll()}
  else if(t.id==='addS'){S.sample=false;S.shifts.push({name:tr('shift')+' '+(S.shifts.length+1),start:'00:00',hours:0});renderAll()}
  else if(t.dataset.delg!==undefined){var gi=+t.dataset.delg;if(pend===gi){S.sample=false;pend=-1;S.groups.splice(gi,1);renderAll()}else{pend=gi;renderAll();setTimeout(function(){if(pend===gi){pend=-1;renderAll()}},4000);return}}
  else if(t.dataset.dels!==undefined){S.sample=false;S.shifts.splice(+t.dataset.dels,1);renderAll()}
  else return;
  save()
});
document.getElementById('start').value=S.start;
document.getElementById('period').value=S.period;
document.getElementById('count').value=S.count;
(function(){var f=window.fetch;window.fetch=function(u,o){o=o||{};var c=new AbortController(),id=setTimeout(function(){c.abort()},8000);o.signal=c.signal;return f.call(window,u,o).then(function(r){clearTimeout(id);return r},function(e){clearTimeout(id);throw(e&&e.name==='AbortError')?new Error('timeout 8s'):e})}})();
migrate();if(!S.code&&S.snap!==undefined)S.snap=JSON.stringify(shared());window.addEventListener('online',function(){pull()});applyLang();new MutationObserver(function(){applyRO()}).observe(document.querySelector('main'),{childList:true,subtree:true});pull();setInterval(function(){if(!document.hidden)pull()},8000);document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
