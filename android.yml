name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Generate app icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Use stable signing key (if provided)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using stable signing key"
          else
            echo "No KEYSTORE_B64 secret, using a temporary key"
          fi
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: rotations-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
